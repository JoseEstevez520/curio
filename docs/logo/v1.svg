<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Body gradient: light top-left to dark bottom-right -->
    <radialGradient id="bodyGradient" cx="35%" cy="30%" r="65%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#B3E5FC" />
      <stop offset="30%" stop-color="#7EC8E3" />
      <stop offset="70%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#1565C0" />
    </radialGradient>

    <!-- Subtle highlight for top-left sheen -->
    <radialGradient id="highlightGradient" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)" />
      <stop offset="60%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>

    <!-- Inner shadow filter -->
    <filter id="innerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feOffset dx="3" dy="5" result="offsetBlur" />
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="out" result="inverse" />
      <feFlood flood-color="#0D47A1" flood-opacity="0.25" result="color" />
      <feComposite in="color" in2="inverse" operator="in" result="shadow" />
      <feComposite in="shadow" in2="SourceGraphic" operator="over" />
    </filter>

    <!-- Soft drop shadow under the blob -->
    <filter id="dropShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
      <feOffset dx="0" dy="8" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.15" result="color" />
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Blob body -->
  <g id="body" filter="url(#dropShadow)">
    <!-- Main blob shape: organic, wider than tall, flatter bottom -->
    <path
      id="bodyShape"
      d="
        M 200 80
        C 245 72, 290 78, 320 100
        C 350 122, 365 155, 362 190
        C 360 225, 348 260, 330 285
        C 312 310, 280 325, 250 330
        C 220 335, 200 336, 170 332
        C 140 326, 108 312, 85 288
        C 62 264, 48 232, 46 198
        C 44 164, 52 130, 72 108
        C 92 86, 130 76, 160 78
        C 175 77, 188 79, 200 80
        Z
      "
      fill="url(#bodyGradient)"
      filter="url(#innerShadow)"
    />

    <!-- Highlight overlay for 3D sheen -->
    <path
      d="
        M 200 80
        C 245 72, 290 78, 320 100
        C 350 122, 365 155, 362 190
        C 360 225, 348 260, 330 285
        C 312 310, 280 325, 250 330
        C 220 335, 200 336, 170 332
        C 140 326, 108 312, 85 288
        C 62 264, 48 232, 46 198
        C 44 164, 52 130, 72 108
        C 92 86, 130 76, 160 78
        C 175 77, 188 79, 200 80
        Z
      "
      fill="url(#highlightGradient)"
    />
  </g>

  <!-- Eyes -->
  <g id="eyes">
    <!-- Left eye -->
    <g id="eyeLeft">
      <circle cx="165" cy="220" r="18" fill="#1A1A2E" />
      <circle cx="159" cy="213" r="5.5" fill="#FFFFFF" />
    </g>

    <!-- Right eye -->
    <g id="eyeRight">
      <circle cx="245" cy="220" r="18" fill="#1A1A2E" />
      <circle cx="239" cy="213" r="5.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
