<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Glossy 3D lighting filter -->
    <filter id="glossy3D" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Blur the source alpha to create a smooth surface for lighting -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blurred"/>

      <!-- Specular lighting from top-left for glossy highlight -->
      <feSpecularLighting
        in="blurred"
        result="specLight"
        surfaceScale="5"
        specularConstant="1.2"
        specularExponent="25"
        lighting-color="#ffffff">
        <fePointLight x="160" y="80" z="200"/>
      </feSpecularLighting>

      <!-- Composite specular light to only show on the shape -->
      <feComposite in="specLight" in2="SourceAlpha" operator="in" result="clippedLight"/>

      <!-- Combine original graphic with specular highlight -->
      <feComposite in="SourceGraphic" in2="clippedLight" operator="over" result="litBase"/>

      <!-- Add the specular on top with screen blending via arithmetic -->
      <feComposite in="clippedLight" in2="SourceGraphic" operator="arithmetic"
        k1="0" k2="1" k3="1" k4="0" result="combined"/>

      <!-- Final clip to source shape -->
      <feComposite in="combined" in2="SourceAlpha" operator="in"/>
    </filter>

    <!-- Soft shadow filter for bottom darkening -->
    <filter id="bottomShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="shadowBlur"/>
    </filter>

    <!-- Radial gradient for base blob color with depth -->
    <radialGradient id="blobGradient" cx="45%" cy="35%" r="55%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#90CAF9"/>
      <stop offset="45%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </radialGradient>

    <!-- Top highlight gradient -->
    <radialGradient id="highlightGradient" cx="42%" cy="25%" r="40%" fx="42%" fy="22%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom shadow gradient -->
    <radialGradient id="shadowGradient" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#0D47A1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0D47A1" stop-opacity="0"/>
    </radialGradient>

    <!-- Eye highlight filter for subtle glow -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse id="groundShadow" cx="200" cy="340" rx="110" ry="16"
    fill="#000000" opacity="0.12" filter="url(#bottomShadow)"/>

  <!-- Main blob body with organic amorphous shape -->
  <g id="blobBody">
    <!-- Base blob shape - organic, wider than tall, flatter bottom -->
    <path id="blobShape"
      d="M 95,240
         C 75,235 55,210 58,180
         C 60,155 70,135 90,118
         C 108,102 130,92 155,88
         C 175,85 195,84 210,84
         C 230,84 255,86 275,92
         C 298,99 318,112 330,130
         C 342,148 348,170 345,195
         C 342,218 332,235 315,248
         C 300,258 280,265 258,270
         C 235,275 210,276 190,275
         C 165,274 140,270 120,262
         C 105,255 95,248 95,240
         Z"
      fill="url(#blobGradient)"
      filter="url(#glossy3D)"/>

    <!-- Bottom shadow overlay -->
    <path id="blobShadowOverlay"
      d="M 95,240
         C 75,235 55,210 58,180
         C 60,155 70,135 90,118
         C 108,102 130,92 155,88
         C 175,85 195,84 210,84
         C 230,84 255,86 275,92
         C 298,99 318,112 330,130
         C 342,148 348,170 345,195
         C 342,218 332,235 315,248
         C 300,258 280,265 258,270
         C 235,275 210,276 190,275
         C 165,274 140,270 120,262
         C 105,255 95,248 95,240
         Z"
      fill="url(#shadowGradient)"/>

    <!-- Top highlight overlay for glossy look -->
    <path id="blobHighlight"
      d="M 95,240
         C 75,235 55,210 58,180
         C 60,155 70,135 90,118
         C 108,102 130,92 155,88
         C 175,85 195,84 210,84
         C 230,84 255,86 275,92
         C 298,99 318,112 330,130
         C 342,148 348,170 345,195
         C 342,218 332,235 315,248
         C 300,258 280,265 258,270
         C 235,275 210,276 190,275
         C 165,274 140,270 120,262
         C 105,255 95,248 95,240
         Z"
      fill="url(#highlightGradient)"/>

    <!-- Small bright specular spot on upper area -->
    <ellipse id="specularSpot" cx="175" cy="125" rx="32" ry="18"
      fill="#ffffff" opacity="0.35" transform="rotate(-15, 175, 125)"/>
  </g>

  <!-- Eyes group -->
  <g id="eyes">
    <!-- Left eye -->
    <g id="leftEye">
      <circle cx="170" cy="195" r="16" fill="#1a1a1a"/>
      <!-- Primary highlight -->
      <circle cx="164" cy="188" r="5.5" fill="#ffffff" opacity="0.95"/>
      <!-- Secondary small highlight -->
      <circle cx="175" cy="200" r="2.5" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- Right eye -->
    <g id="rightEye">
      <circle cx="232" cy="195" r="16" fill="#1a1a1a"/>
      <!-- Primary highlight -->
      <circle cx="226" cy="188" r="5.5" fill="#ffffff" opacity="0.95"/>
      <!-- Secondary small highlight -->
      <circle cx="237" cy="200" r="2.5" fill="#ffffff" opacity="0.5"/>
    </g>
  </g>
</svg>